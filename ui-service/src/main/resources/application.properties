# Application Configuration
spring.application.name=iceberg-ui-service
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:icebergdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Configuration
kafka.bootstrap-servers=localhost:9092
kafka.error-topic=json-messages-error
kafka.security-protocol=PLAINTEXT
kafka.sasl-mechanism=GSSAPI
kafka.keytab-path=
kafka.principal=

# Storage Configuration
storage.type=HDFS
storage.base-path=localhost:9000/iceberg
storage.retention-days=10
storage.hdfs-keytab-path=
storage.hdfs-principal=
storage.hdfs-conf-dir=/etc/hadoop/conf
storage.s3-access-key=
storage.s3-secret-key=
storage.s3-region=
storage.s3-endpoint=

# Iceberg Configuration
iceberg.table-name=messages
iceberg.partition-by=timestamp

# Metrics Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging Configuration
logging.level.root=INFO
logging.level.com.gs.iceberg=DEBUG
logging.file.name=logs/ui-service.log

# Application Configuration
spring.application.name=iceberg-ingestion-service
server.port=8081

# Kafka Configuration
kafka.bootstrap-servers=localhost:9092
kafka.topic=json-messages
kafka.consumer-group=iceberg-consumer
kafka.security-protocol=PLAINTEXT
kafka.sasl-mechanism=GSSAPI
kafka.keytab-path=
kafka.principal=
kafka.consumption-rate=100

# Spark Configuration
spark.app-name=Kafka-Iceberg-Ingestion
spark.master=local[*]
spark.warehouse-location=/tmp/iceberg/warehouse
spark.hadoop-conf-dir=/etc/hadoop/conf
spark.keytab-path=
spark.principal=

# Storage Configuration
storage.type=HDFS
storage.base-path=localhost:9000/iceberg
storage.retention-days=10
storage.hdfs-keytab-path=
storage.hdfs-principal=
storage.hdfs-conf-dir=/etc/hadoop/conf
storage.s3-access-key=
storage.s3-secret-key=
storage.s3-region=
storage.s3-endpoint=

# Iceberg Configuration
iceberg.table-name=messages
iceberg.partition-by=timestamp

# Schema Configuration
schema.file=config/schema.json

# Metrics Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.gs.iceberg=DEBUG
logging.file.name=logs/ingestion-service.log
